# Static delivery for the sdkwork-mall dev preview.
#
# /srv/mall/pc  <- apps/sdkwork-mall-pc/dist/cloud/dev  (desktop)
# /srv/mall/h5  <- apps/sdkwork-mall-h5/dist/cloud/dev  (mobile)
#
# Both bundles are cloud-profile Adaptive Web builds; their baked runtime env
# lists api-dev.sdkwork.com + api-dev.birdcoder.com, and the shared SDK
# resolver selects api-dev.birdcoder.com for a mall-dev.birdcoder.com page
# (ENVIRONMENT_SPEC §5.1.0.1 host-aware cloud API edge).

root /srv/mall/$sdkwork_mall_surface_final;
index index.html;

# runtime-env.json varies per deployment and must never be cached.
location = /runtime-env.json {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
}

# Fingerprinted Vite assets are content-addressed and immutable.
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# SPA shell: pick the device surface, then fall back to index.html.
location / {
    try_files $uri $uri/ /index.html;
}

add_header Vary "User-Agent, Sec-CH-UA-Mobile" always;
add_header X-Content-Type-Options "nosniff" always;

# Development-only credential-entry bootstrap handoff: the public application
# access token is injected as the canonical global before app modules execute
# (IAM_CREDENTIAL_ENTRY_SPEC.md §4/§5). Staging/production never inject.
sub_filter '</head>' '<script>globalThis.__SDKWORK_CREDENTIAL_ENTRY_BOOTSTRAP_ACCESS_TOKEN__="$sdkwork_mall_bootstrap_access_token";</script></head>';
sub_filter_once on;
