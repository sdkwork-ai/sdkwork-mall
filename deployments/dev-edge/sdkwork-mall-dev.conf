# SDKWork Mall dev preview on the local development edge (:80/:443).
#
# Scope: LOCAL DEVELOPMENT HOST ONLY, exactly like the api-dev.* convenience
# vhost in sdkwork-api-dev.conf. The public SDKWork edge stays
# sdkwork-webserver (NGINX_SPEC.md §0); sdkwork-mall is classified as a
# client-only module (no owned public ingress), so this dev-only edge block
# serves the locally built Adaptive Web PC/H5 bundles for a test URL.
#
# The UA map / @pc / @h5 dispatch mirrors SDKWORK_DEPLOY_SPEC.md §8.1:
# mobile prefers h5, desktop prefers pc, iPad stays pc, and an explicit
# Sec-CH-UA-Mobile=?1 client hint forces h5.

map $http_user_agent $sdkwork_mall_surface {
    "~*iPad" pc;
    "~*(Mobile|Android|iPhone|iPod|webOS|BlackBerry|IEMobile|Opera Mini|MicroMessenger|HuaweiBrowser|HarmonyOS|UCBrowser|Quark)" h5;
    default pc;
}

map $http_sec_ch_ua_mobile $sdkwork_mall_mobile_ch {
    default "";
    "?1" "1";
}

map $sdkwork_mall_mobile_ch $sdkwork_mall_surface_final {
    default $sdkwork_mall_surface;
    "1" h5;
}

server {
    listen 80;
    listen [::]:80;
    server_name mall-dev.birdcoder.com;

    include /etc/nginx/snippets/sdkwork-mall-dev-static.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mall-dev.birdcoder.com;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SDKWORK_DEV_SSL:10m;
    ssl_session_timeout 1h;

    include /etc/nginx/snippets/sdkwork-mall-dev-static.conf;
}
