# Named Adaptive Web locations (SDKWORK_DEPLOY_SPEC.md section 8.1) for the
# sdkwork-mall development edge (tests/nginx/edge-parity battery contract).
#
# The Adaptive Web roots follow the installed-package layout: the entrypoint
# materializes the cloud-profile dev dist (apps/sdkwork-mall-{pc,h5}/dist/
# cloud/dev in the space checkout, FRONTEND_CODE_SPEC.md §7) into
# /usr/share/sdkwork/mall/web/{pc,h5} on boot, and the standalone image build
# bakes the same trees.
#
# /assets/ MUST NOT fall through to the SPA document. Every release replaces
# the whole content-hashed chunk set, so a browser that still holds the
# previous document (open tab, bfcache) asks for chunk names that no longer
# exist; answering those with index.html aborts the page with a strict module
# MIME check instead of reporting a missing file.

location ^~ /assets/ {
    root /usr/share/sdkwork/mall/web/$sdkwork_webserver_surface_final;
    try_files $uri =404;
    add_header Vary "User-Agent, Sec-CH-UA-Mobile" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

# Root-level entry payloads (runtime-env.json, credential-entry-bootstrap-*.js,
# favicon assets) are module/document resources too: answer 404 instead of
# handing back the SPA document with a non-matching content type.
location ~* ^/[^/]+\.(?:js|mjs|css|map|wasm|json|svg|png|jpe?g|gif|webp|ico|woff2?|ttf|otf)$ {
    root /usr/share/sdkwork/mall/web/$sdkwork_webserver_surface_final;
    try_files $uri =404;
    add_header Vary "User-Agent, Sec-CH-UA-Mobile" always;
    add_header Cache-Control $sdkwork_webserver_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

location @pc {
    root /usr/share/sdkwork/mall/web/pc;
    index index.html;
    try_files $uri $uri/ /index.html;
    add_header Vary "User-Agent, Sec-CH-UA-Mobile" always;
    add_header Cache-Control $sdkwork_webserver_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

location @h5 {
    root /usr/share/sdkwork/mall/web/h5;
    index index.html;
    try_files $uri $uri/ /index.html;
    add_header Vary "User-Agent, Sec-CH-UA-Mobile" always;
    add_header Cache-Control $sdkwork_webserver_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
