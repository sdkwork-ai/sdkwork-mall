# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/mall/webserver.pid;
error_log /var/log/sdkwork/mall/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    server {
        listen 80;
        listen 443 ssl;
        server_name mall-test.birdcoder.com;
        include snippets/adaptive-web.named-locations.conf;
        ssl_certificate /etc/sdkwork/certs/letsencrypt/mall-test.birdcoder.com/fullchain.pem;
        ssl_certificate_key /etc/sdkwork/certs/letsencrypt/mall-test.birdcoder.com/privkey.pem;
        ssl_trusted_certificate /etc/sdkwork/certs/letsencrypt/mall-test.birdcoder.com/chain.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        location / {
            include snippets/adaptive-web.dispatch.conf;
        }
    }
}
