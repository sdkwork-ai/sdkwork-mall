environment = "test"

[http]

# Adaptive static delivery from the entrypoint-seeded installed-package root
# (placeholder shell until apps/sdkwork-mall-* build the test dist).
[[http.server]]
listen = ["80", "443 ssl"]
serverName = ["mall-test.birdcoder.com"]

[http.server.tls]
certFile = "/etc/sdkwork/certs/letsencrypt/mall-test.birdcoder.com/fullchain.pem"
certKeyFile = "/etc/sdkwork/certs/letsencrypt/mall-test.birdcoder.com/privkey.pem"
chainFile = "/etc/sdkwork/certs/letsencrypt/mall-test.birdcoder.com/chain.pem"
protocols = ["TLSv1.2", "TLSv1.3"]

[[http.server.location]]
match = "/"
include = ["snippets/adaptive-web.dispatch.conf"]
